<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltShield - Форум</title>
    <style>
        /* [ ВСЕ СТИЛИ ТАКИЕ ЖЕ ] */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0a1428 0%, #0c1e2e 50%, #07121e 100%); color: #f0f9ff; min-height: 100vh; overflow-x: hidden; }
        .snowflakes { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .snowflake { position: absolute; top: -10px; color: rgba(255, 255, 255, 0.8); animation: fall linear infinite; }
        @keyframes fall { 0% { transform: translateY(-100px) rotate(0deg); opacity: 1; } 100% { transform: translateY(calc(100vh + 100px)) rotate(360deg); opacity: 0; } }
        .header { position: relative; z-index: 1; background: rgba(10, 25, 47, 0.4); backdrop-filter: blur(10px); padding: 30px 0; text-align: center; border-bottom: 1px solid rgba(100, 200, 255, 0.2); }
        .header h1 { font-size: 3.5em; font-weight: 900; background: linear-gradient(135deg, #e6f7ff 0%, #a0d8ff 50%, #5dade2 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; }
        .login-page { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .auth-card { background: rgba(15, 35, 60, 0.3); backdrop-filter: blur(15px); border: 1px solid rgba(100, 200, 255, 0.2); border-radius: 15px; padding: 40px; width: 100%; max-width: 420px; }
        .auth-card h2 { text-align: center; color: #a0d8ff; margin-bottom: 30px; }
        .auth-card input { width: 100%; padding: 14px; margin: 12px 0; border: 1px solid rgba(100, 200, 255, 0.3); background: rgba(10, 25, 47, 0.5); color: #e6f7ff; border-radius: 10px; font-size: 16px; }
        .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #1e5799 0%, #20a0d8 100%); border: none; color: #e6f7ff; font-size: 18px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; margin-top: 10px; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); }
        .btn-secondary { background: #555 !important; }
        .forum-hidden { display: none !important; }
        .forum-grid { display: grid; grid-template-columns: 280px 1fr; gap: 25px; margin-top: 30px; }
        .sidebar { background: rgba(15, 35, 60, 0.3); backdrop-filter: blur(15px); border: 1px solid rgba(100, 200, 255, 0.2); border-radius: 15px; padding: 25px; height: fit-content; position: sticky; top: 30px; }
        .ticket-item { background: rgba(20, 50, 80, 0.3); border: 1px solid rgba(100, 200, 255, 0.15); border-radius: 12px; padding: 20px; margin-bottom: 15px; cursor: pointer; transition: all 0.3s ease; }
        .ticket-item:hover { transform: translateY(-5px); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 1000; }
        .modal-content { background: rgba(15, 35, 60, 0.9); border: 1px solid rgba(100, 200, 255, 0.3); border-radius: 15px; max-width: 850px; width: 90%; max-height: 85vh; margin: 50px auto; padding: 30px; color: #e6f7ff; position: relative; overflow-y: auto; }
        .modal-close { position: absolute; top: 15px; right: 15px; font-size: 30px; cursor: pointer; color: #a0d8ff; }
        .message { background: rgba(20, 50, 80, 0.4); border-radius: 10px; padding: 15px; margin-bottom: 15px; border-left: 4px solid #5dade2; }
        .message.admin { border-left: 4px solid #1e5799; }
        .reply-form textarea { width: 100%; min-height: 100px; padding: 10px; background: rgba(10, 25, 47, 0.5); border: 1px solid rgba(100, 200, 255, 0.3); border-radius: 5px; color: #e6f7ff; font-size: 16px; resize: vertical; }
        .admin-panel { display: none; background: rgba(15, 35, 60, 0.3); padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="snowflakes" id="snowflakes"></div>
    
    <div class="header">
        <h1>❄️ AltShield ❄️</h1>
        <p>Технический Форум</p>
    </div>
    
    <div class="container">
        <!-- ✅ СТРАНИЦА ВХОДА -->
        <div class="login-page" id="loginPage">
            <div class="auth-card">
                <h2>🔐 Вход в систему</h2>
                <input id="email" placeholder="Email" type="email" required>
                <input id="password" placeholder="Пароль" type="password" required>
                <button class="btn-primary" onclick="login()">Войти →</button>
                
                <!-- ✅ КНОПКА РЕГИСТРАЦИИ -->
                <button class="btn-primary btn-secondary" onclick="showRegister()">
                    📝 Создать новый аккаунт
                </button>
                
                <!-- Сообщение об ошибке -->
                <p id="errorMsg" style="color: #e74c3c; margin-top: 15px; display: none;"></p>
            </div>
        </div>
        
        <!-- ✅ ОКНО РЕГИСТРАЦИИ -->
        <div class="login-page forum-hidden" id="registerPage" style="display: none;">
            <div class="auth-card">
                <h2>📝 Регистрация</h2>
                <input id="regEmail" placeholder="Email" type="email" required>
                <input id="regPassword" placeholder="Пароль (мин. 6 символов)" type="password" required>
                <button class="btn-primary" onclick="register()">Создать аккаунт</button>
                <button class="btn-primary btn-secondary" onclick="showLogin()">← Назад</button>
                <p id="regErrorMsg" style="color: #e74c3c; margin-top: 15px; display: none;"></p>
            </div>
        </div>
        
        <!-- ФОРУМ -->
        <div class="forum-hidden" id="forumPage" style="display: none;">
            <div class="forum-grid">
                <div class="sidebar">
                    <div class="user-info">
                        <p><strong>👤</strong> <span id="currentUser">-</span></p>
                        <p><strong>Роль:</strong> <span id="userRole">-</span></p>
                    </div>
                    <button class="btn-primary" onclick="createTicket()">➕ Создать тикет</button>
                    <button class="btn-primary btn-secondary" onclick="logout()">🚪 Выйти</button>
                </div>
                
                <div>
                    <div class="admin-panel" id="adminPanel">
                        <h3>🛡️ Панель администратора</h3>
                        <div id="ticketsList"></div>
                    </div>
                    
                    <div class="tickets-section">
                        <h2>📨 Тикеты</h2>
                        <div id="ticketsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно -->
    <div class="modal" id="ticketModal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2 id="modalTicketTitle"></h2>
            <div id="ticketMessages"></div>
            <div class="reply-form" id="replyForm">
                <textarea id="replyText" placeholder="Введите ваш ответ..."></textarea>
                <button class="btn-primary" onclick="sendReply()">Отправить</button>
                <button class="btn-primary" id="resolveBtn" onclick="resolveTicket()" style="background: #27ae60;">Закрыть тикет</button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyDFrNtflFEnxG6JmxUIutdVloprgJcyMFs",
            authDomain: "altshield-forum.firebaseapp.com",
            projectId: "altshield-forum",
            storageBucket: "altshield-forum.firebasestorage.app",
            messagingSenderId: "140096930192",
            appId: "1:140096930192:web:d8ff3b01a1c1a1e374f315"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUser = null;
        let currentTicket = null;
        let ticketsUnsubscribe = null;

        // Функции страниц
        function showLogin() {
            console.log("📍 Показываем страницу входа");
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('registerPage').style.display = 'none';
            document.getElementById('forumPage').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';
        }

        function showRegister() {
            console.log("📍 Показываем страницу регистрации");
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('registerPage').style.display = 'flex';
            document.getElementById('forumPage').style.display = 'none';
            document.getElementById('regErrorMsg').style.display = 'none';
        }

        function showForum() {
            console.log("📍 Показываем форум как", currentUser.email);
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('registerPage').style.display = 'none';
            document.getElementById('forumPage').style.display = 'block';
            
            const isOwner = currentUser.email === "kjuvboltm098@gmail.com";
            document.getElementById('currentUser').textContent = currentUser.email;
            document.getElementById('userRole').textContent = isOwner ? '👑 Владелец' : '👤 Пользователь';
            document.getElementById('adminPanel').style.display = isOwner ? 'block' : 'none';
            
            loadTickets();
        }

        // Аутентификация
        async function register() {
            console.log("📝 Попытка регистрации...");
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const errorMsg = document.getElementById('regErrorMsg');
            
            if (!email || !password) {
                errorMsg.textContent = 'Заполните все поля!';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorMsg.textContent = 'Пароль минимум 6 символов!';
                errorMsg.style.display = 'block';
                return;
            }
            
            try {
                errorMsg.style.display = 'none';
                await createUserWithEmailAndPassword(auth, email, password);
                alert('✅ Регистрация успешна! Теперь войдите.');
                showLogin();
            } catch (error) {
                console.error("❌ Ошибка регистрации:", error);
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
            }
        }

        async function login() {
            console.log("🔐 Попытка входа...");
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (!email || !password) {
                errorMsg.textContent = 'Введите email и пароль!';
                errorMsg.style.display = 'block';
                return;
            }
            
            try {
                errorMsg.style.display = 'none';
                await signInWithEmailAndPassword(auth, email, password);
                console.log("✅ Вход успешный");
            } catch (error) {
                console.error("❌ Ошибка входа:", error);
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
            }
        }

        async function logout() {
            await signOut(auth);
        }

        // Тикеты
        async function createTicket() {
            const title = prompt('📝 Тема тикета (мин. 5 символов):');
            if (!title || title.trim().length < 5) {
                alert('❌ Минимум 5 символов!');
                return;
            }
            
            const text = prompt('💬 Описание проблемы (мин. 10 символов):');
            if (!text || text.trim().length < 10) {
                alert('❌ Минимум 10 символов!');
                return;
            }
            
            try {
                await addDoc(collection(db, 'tickets'), {
                    title: title.trim(),
                    author: currentUser.email,
                    status: 'open',
                    createdAt: new Date(),
                    messages: [{
                        author: currentUser.email,
                        text: text.trim(),
                        timestamp: new Date(),
                        isAdmin: false
                    }]
                });
                alert('✅ Тикет создан успешно!');
            } catch (error) {
                alert('❌ Ошибка: ' + error.message);
            }
        }

        function loadTickets() {
            const list = document.getElementById('ticketsList');
            list.innerHTML = '<p style="color: #5dade2;">Загрузка...</p>';
            
            const q = query(collection(db, 'tickets'), orderBy('createdAt', 'desc'));
            
            if (ticketsUnsubscribe) ticketsUnsubscribe();
            
            ticketsUnsubscribe = onSnapshot(q, (snapshot) => {
                list.innerHTML = '';
                const isOwner = currentUser.email === "kjuvboltm098@gmail.com";
                
                if (isOwner) {
                    document.querySelector('.tickets-section h2').textContent = '📨 Все тикеты';
                } else {
                    document.querySelector('.tickets-section h2').textContent = '📨 Ваши тикеты';
                }
                
                snapshot.forEach(doc => {
                    const ticket = { id: doc.id, ...doc.data() };
                    if (!isOwner && ticket.author !== currentUser.email) return;
                    
                    const div = document.createElement('div');
                    div.className = `ticket-item ${ticket.status === 'resolved' ? 'resolved' : ''}`;
                    div.onclick = () => openTicket(ticket);
                    
                    div.innerHTML = `
                        <div class="ticket-header">
                            <span class="ticket-title">${ticket.title}</span>
                            <span class="ticket-status status-${ticket.status}">${ticket.status}</span>
                        </div>
                        <div class="ticket-meta">
                            Автор: ${ticket.author} | ${ticket.createdAt.toDate().toLocaleString()}
                        </div>
                    `;
                    list.appendChild(div);
                });
                
                if (list.innerHTML === '') {
                    list.innerHTML = '<p style="color: #5dade2; text-align: center;">Нет тикетов</p>';
                }
            });
        }

        function openTicket(ticket) {
            currentTicket = ticket;
            document.getElementById('modalTicketTitle').textContent = ticket.title;
            document.getElementById('ticketMessages').innerHTML = '';
            
            ticket.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.isAdmin ? 'admin' : ''}`;
                div.innerHTML = `
                    <div class="message-owner">${msg.author} ${msg.isAdmin ? '(Админ)' : ''}</div>
                    <div class="message-text">${msg.text}</div>
                    <div class="message-time">${msg.timestamp.toDate().toLocaleString()}</div>
                `;
                document.getElementById('ticketMessages').appendChild(div);
            });
            
            const isOwner = currentUser.email === "kjuvboltm098@gmail.com";
            document.getElementById('replyForm').style.display = (isOwner || ticket.author === currentUser.email) && ticket.status !== 'resolved' ? 'block' : 'none';
            document.getElementById('resolveBtn').style.display = isOwner && ticket.status !== 'resolved' ? 'block' : 'none';
            
            document.getElementById('ticketModal').style.display = 'block';
        }

        async function sendReply() {
            const text = document.getElementById('replyText').value.trim();
            if (!text) return;
            
            const isOwner = currentUser.email === "kjuvboltm098@gmail.com";
            currentTicket.messages.push({
                author: currentUser.email,
                text: text,
                timestamp: new Date(),
                isAdmin: isOwner
            });
            
            currentTicket.status = isOwner ? 'answered' : 'open';
            
            await updateDoc(doc(db, 'tickets', currentTicket.id), {
                messages: currentTicket.messages,
                status: currentTicket.status
            });
            
            document.getElementById('replyText').value = '';
        }

        async function resolveTicket() {
            if (!confirm('Закрыть тикет?')) return;
            await updateDoc(doc(db, 'tickets', currentTicket.id), { status: 'resolved' });
            alert('✅ Тикет закрыт!');
            closeModal();
        }

        function closeModal() {
            document.getElementById('ticketModal').style.display = 'none';
            document.getElementById('replyText').value = '';
            currentTicket = null;
        }

        // Запускаем при загрузке
        showLogin();
    </script>
</body>
    </html>
