<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltShield - Новогодний Форум</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at top, #0c1e2e 0%, #07121e 70%);
            color: #f0f9ff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Новогодний снег */
        .snowflakes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        
        .snowflake {
            position: absolute;
            top: -10px;
            color: rgba(255, 255, 255, 0.8);
            animation: snowfall linear infinite;
            filter: blur(0.3px);
        }
        
        @keyframes snowfall {
            0% {
                transform: translateY(-100px) rotate(0deg) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) rotate(540deg) translateX(100px);
                opacity: 0;
            }
        }
        
        .header {
            position: relative;
            z-index: 1;
            background: rgba(10, 25, 47, 0.25);
            backdrop-filter: blur(12px) saturate(180%);
            border-bottom: 1px solid rgba(100, 200, 255, 0.15);
            padding: 30px 0;
            text-align: center;
        }
        
        .header h1 {
            font-size: 4em;
            font-weight: 900;
            background: linear-gradient(135deg, #e6f7ff 0%, #a0d8ff 30%, #fff 50%, #f39c12 70%, #e74c3c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 12px 40px rgba(31, 110, 140, 0.5);
            letter-spacing: -2px;
            animation: gradientShift 8s ease infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg); }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        
        .auth-card {
            background: rgba(15, 35, 60, 0.25);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 
                0 8px 32px rgba(0, 10, 30, 0.4), 
                inset 0 0 16px rgba(100, 200, 255, 0.1);
        }
        
        .auth-card h2 {
            text-align: center;
            background: linear-gradient(135deg, #a0d8ff 0%, #5dade2 50%, #f39c12 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 30px;
            font-size: 2.2em;
        }
        
        .auth-card input {
            width: 100%;
            padding: 16px;
            margin: 14px 0;
            border: 1px solid rgba(100, 200, 255, 0.3);
            background: rgba(10, 25, 47, 0.3);
            color: #e6f7ff;
            border-radius: 12px;
            font-size: 16px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1e5799 0%, #20a0d8 40%, #f39c12 70%, #e74c3c 100%);
            border: none;
            color: #e6f7ff;
            font-size: 18px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 15px;
        }
        
        .btn-primary:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 35px rgba(31, 110, 140, 0.6);
        }
        
        .btn-secondary {
            background: #555 !important;
        }
        
        .forum-hidden {
            display: none !important;
        }
        
        .forum-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            margin-top: 30px;
        }
        
        .sidebar {
            background: rgba(15, 35, 60, 0.25);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 20px;
            padding: 25px;
            position: sticky;
            top: 30px;
            box-shadow: 0 6px 25px rgba(0, 10, 30, 0.4);
        }
        
        .user-info {
            background: rgba(20, 50, 80, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(100, 200, 255, 0.1);
        }
        
        .ticket-item {
            background: rgba(20, 50, 80, 0.3);
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(5px);
        }
        
        .ticket-item:hover {
            transform: translateY(-6px) translateX(5px);
            box-shadow: 0 12px 35px rgba(31, 110, 140, 0.4);
            border-color: rgba(100, 200, 255, 0.4);
            background: rgba(25, 65, 100, 0.4);
        }
        
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }
        
        .modal-content {
            background: rgba(15, 35, 60, 0.9);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 24px;
            max-width: 850px;
            width: 90%;
            max-height: 85vh;
            margin: 50px auto;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0, 10, 30, 0.6);
        }
        
        .message {
            background: rgba(20, 50, 80, 0.4);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            border-left: 4px solid #5dade2;
            backdrop-filter: blur(5px);
        }
        
        .message.admin {
            border-left: 4px solid #1e5799;
            background: rgba(30, 87, 153, 0.4);
        }
        
        .admin-panel {
            display: none;
            background: rgba(15, 35, 60, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0, 10, 30, 0.3);
            border-left: 4px solid #f39c12;
        }
    </style>
</head>
<body>
    <div class="snowflakes" id="snowflakes"></div>
    
    <div class="header">
        <h1>❄️ AltShield ❄️</h1>
        <p>Новогодний Форум Тех.Поддержки 2024</p>
    </div>
    
    <div class="container">
        <!-- ✅ ОКНО ВХОДА -->
        <div class="login-page" id="loginPage">
            <div class="auth-card">
                <h2>🔐 Вход</h2>
                <input id="email" placeholder="Email" type="email" required>
                <input id="password" placeholder="Пароль" type="password" required>
                <button class="btn-primary" onclick="login()">Войти →</button>
                
                <!-- ✅ КНОПКА РЕГИСТРАЦИИ ВИДНА СРАЗУ -->
                <button class="btn-primary btn-secondary" onclick="showRegister()">
                    📝 Зарегистрироваться
                </button>
                
                <p id="errorMsg" style="color: #e74c3c; margin-top: 15px; display: none;"></p>
            </div>
        </div>
        
        <!-- ✅ ОКНО РЕГИСТРАЦИИ -->
        <div class="login-page forum-hidden" id="registerPage">
            <div class="auth-card">
                <h2>📝 Регистрация</h2>
                <input id="regEmail" placeholder="Email" type="email" required>
                <input id="regPassword" placeholder="Пароль (мин. 6)" type="password" required>
                <button class="btn-primary" onclick="register()">Создать аккаунт</button>
                <button class="btn-primary btn-secondary" onclick="showLogin()">← Назад</button>
                <p id="regErrorMsg" style="color: #e74c3c; margin-top: 15px; display: none;"></p>
            </div>
        </div>
        
        <!-- ✅ ФОРУМ -->
        <div class="forum-hidden" id="forumPage">
            <div class="forum-grid">
                <div class="sidebar">
                    <div class="user-info">
                        <p><strong>👤</strong> <span id="currentUser">-</span></p>
                        <p><strong>Роль:</strong> <span id="userRole">-</span></p>
                    </div>
                    <button class="btn-primary" onclick="createTicket()">➕ Создать тикет</button>
                    <button class="btn-primary btn-secondary" onclick="logout()">🚪 Выйти</button>
                </div>
                
                <div>
                    <!-- Панель только для владельца -->
                    <div class="admin-panel" id="adminPanel">
                        <h3>🛡️ Панель владельца</h3>
                        <p>Все тикеты:</p>
                        <div id="ticketsList"></div>
                    </div>
                    
                    <div class="tickets-section">
                        <h2 id="ticketsSectionTitle">📨 Тикеты</h2>
                        <div id="ticketsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- ✅ МОДАЛЬНОЕ ОКНО -->
    <div class="modal" id="ticketModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2 id="modalTicketTitle"></h2>
            <div id="ticketMessages"></div>
            <div class="reply-form" id="replyForm">
                <textarea id="replyText" placeholder="Введите ваш ответ..."></textarea>
                <button class="btn-primary" onclick="sendReply()">Отправить</button>
                <button class="btn-primary" id="resolveBtn" onclick="resolveTicket()" style="background: #27ae60;">Закрыть тикет</button>
            </div>
        </div>
    </div>

    <!-- 🔥 FIREBASE + ЛОГИКА -->
    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyDFrNtflFEnxG6JmxUIutdVloprgJcyMFs",
            authDomain: "altshield-forum.firebaseapp.com",
            projectId: "altshield-forum",
            storageBucket: "altshield-forum.firebasestorage.app",
            messagingSenderId: "140096930192",
            appId: "1:140096930192:web:d8ff3b01a1c1a1e374f315"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentTicket = null;
        let ticketsUnsubscribe = null;
        const OWNER_EMAIL = "kjuvboltm098@gmail.com"; // ✅ Email владельца

        // Управление страницами
        function showLogin() {
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('registerPage').style.display = 'none';
            document.getElementById('forumPage').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('registerPage').style.display = 'flex';
            document.getElementById('forumPage').style.display = 'none';
            document.getElementById('regErrorMsg').style.display = 'none';
        }

        function showForum() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('registerPage').style.display = 'none';
            document.getElementById('forumPage').style.display = 'block';
            
            document.getElementById('currentUser').textContent = currentUser.email;
            const isOwner = currentUser.email === OWNER_EMAIL;
            document.getElementById('userRole').textContent = isOwner ? '👑 Владелец' : '👤 Пользователь';
            document.getElementById('adminPanel').style.display = isOwner ? 'block' : 'none';
            document.getElementById('ticketsSectionTitle').textContent = isOwner ? '📨 Все тикеты' : '📨 Ваши тикеты';
            
            loadTickets();
        }

        // Аутентификация
        async function register() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const errorMsg = document.getElementById('regErrorMsg');
            
            if (!email || !password) {
                errorMsg.textContent = '❌ Заполните все поля!';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorMsg.textContent = '❌ Пароль минимум 6 символов!';
                errorMsg.style.display = 'block';
                return;
            }
            
            try {
                errorMsg.style.display = 'none';
                await createUserWithEmailAndPassword(auth, email, password);
                alert('✅ Регистрация успешна! Теперь войдите.');
                showLogin();
            } catch (error) {
                errorMsg.textContent = '❌ ' + error.message;
                errorMsg.style.display = 'block';
            }
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (!email || !password) {
                errorMsg.textContent = '❌ Введите email и пароль!';
                errorMsg.style.display = 'block';
                return;
            }
            
            try {
                errorMsg.style.display = 'none';
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorMsg.textContent = '❌ ' + error.message;
                errorMsg.style.display = 'block';
            }
        }

        async function logout() {
            await signOut(auth);
        }

        // Тикеты
        async function createTicket() {
            const title = prompt('📝 Тема тикета (мин. 5 символов):');
            if (!title || title.trim().length < 5) {
                alert('❌ Минимум 5 символов!');
                return;
            }
            
            const text = prompt('💬 Описание проблемы (мин. 10 символов):');
            if (!text || text.trim().length < 10) {
                alert('❌ Минимум 10 символов!');
                return;
            }
            
            try {
                await addDoc(collection(db, 'tickets'), {
                    title: title.trim(),
                    author: currentUser.email,
                    status: 'open',
                    createdAt: new Date(),
                    messages: [{
                        author: currentUser.email,
                        text: text.trim(),
                        timestamp: new Date(),
                        isAdmin: false
                    }]
                });
                alert('✅ Тикет создан успешно!');
            } catch (error) {
                alert('❌ ' + error.message);
            }
        }

        function loadTickets() {
            const list = document.getElementById('ticketsList');
            list.innerHTML = '<p style="color: #5dade2;">Загрузка...</p>';
            
            const q = query(collection(db, 'tickets'), orderBy('createdAt', 'desc'));
            
            if (ticketsUnsubscribe) ticketsUnsubscribe();
            
            ticketsUnsubscribe = onSnapshot(q, (snapshot) => {
                list.innerHTML = '';
                const isOwner = currentUser.email === OWNER_EMAIL;
                
                snapshot.forEach(doc => {
                    const ticket = { id: doc.id, ...doc.data() };
                    if (!isOwner && ticket.author !== currentUser.email) return;
                    
                    const div = document.createElement('div');
                    div.className = `ticket-item ${ticket.status === 'resolved' ? 'resolved' : ''}`;
                    div.onclick = () => openTicket(ticket);
                    
                    const statusText = {
                        'open': 'Открыт',
                        'answered': 'Отвечен',
                        'resolved': 'Решен'
                    };
                    
                    div.innerHTML = `
                        <div class="ticket-header">
                            <span class="ticket-title">${ticket.title}</span>
                            <span class="ticket-status status-${ticket.status}">${statusText[ticket.status]}</span>
                        </div>
                        <div class="ticket-meta">
                            Автор: ${ticket.author} | ${ticket.createdAt.toDate().toLocaleString()}
                        </div>
                    `;
                    list.appendChild(div);
                });
                
                if (list.innerHTML === '') {
                    list.innerHTML = '<p style="color: #5dade2; text-align: center;">Нет тикетов</p>';
                }
            });
        }

        function openTicket(ticket) {
            currentTicket = ticket;
            document.getElementById('modalTicketTitle').textContent = ticket.title;
            document.getElementById('ticketMessages').innerHTML = '';
            
            ticket.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.isAdmin ? 'admin' : ''}`;
                div.innerHTML = `
                    <div class="message-owner">${msg.author} ${msg.isAdmin ? '(Админ)' : ''}</div>
                    <div class="message-text">${msg.text}</div>
                    <div class="message-time">${msg.timestamp.toDate().toLocaleString()}</div>
                `;
                document.getElementById('ticketMessages').appendChild(div);
            });
            
            const isOwner = currentUser.email === OWNER_EMAIL;
            document.getElementById('replyForm').style.display = (isOwner || ticket.author === currentUser.email) && ticket.status !== 'resolved' ? 'block' : 'none';
            document.getElementById('resolveBtn').style.display = isOwner && ticket.status !== 'resolved' ? 'block' : 'none';
            
            document.getElementById('ticketModal').style.display = 'block';
        }

        async function sendReply() {
            const text = document.getElementById('replyText').value.trim();
            if (!text) {
                alert('❌ Введите текст!');
                return;
            }
            
            const isOwner = currentUser.email === OWNER_EMAIL;
            currentTicket.messages.push({
                author: currentUser.email,
                text: text,
                timestamp: new Date(),
                isAdmin: isOwner
            });
            
            currentTicket.status = isOwner ? 'answered' : 'open';
            
            await updateDoc(doc(db, 'tickets', currentTicket.id), {
                messages: currentTicket.messages,
                status: currentTicket.status
            });
            
            document.getElementById('replyText').value = '';
        }

        async function resolveTicket() {
            if (!confirm('❓ Закрыть тикет навсегда?')) return;
            await updateDoc(doc(db, 'tickets', currentTicket.id), { status: 'resolved' });
            alert('✅ Тикет закрыт!');
            closeModal();
        }

        function closeModal() {
            document.getElementById('ticketModal').style.display = 'none';
            document.getElementById('replyText').value = '';
            currentTicket = null;
        }

        // Анимация снега
        setInterval(() => {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '❄';
            snowflake.style.left = Math.random() * 100 + '%';
            snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
            snowflake.style.opacity = Math.random();
            snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';
            document.getElementById('snowflakes').appendChild(snowflake);
            setTimeout(() => snowflake.remove(), 5000);
        }, 200);

        // Проверка входа
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                showForum();
            } else {
                showLogin();
            }
        });
    </script>
</body>
    </html>
