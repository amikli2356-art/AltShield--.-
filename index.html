<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltShield - Тех.Поддержка</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #0c1e2e 50%, #07121e 100%);
            color: #f0f9ff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        .snowflakes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        
        .snowflake {
            position: absolute;
            top: -10px;
            color: rgba(255, 255, 255, 0.8);
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) rotate(360deg) translateX(50px);
                opacity: 0;
            }
        }
        
        .header {
            position: relative;
            z-index: 1;
            background: rgba(10, 25, 47, 0.4);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            text-align: center;
            border-bottom: 1px solid rgba(100, 200, 255, 0.2);
        }
        
        .header h1 {
            font-size: 3.5em;
            font-weight: 900;
            background: linear-gradient(135deg, #e6f7ff 0%, #a0d8ff 50%, #5dade2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.7);
            margin-bottom: 10px;
        }
        
        .header p {
            color: #a0d8ff;
            font-size: 1.2em;
            font-weight: 600;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        
        .auth-card {
            background: rgba(15, 35, 60, 0.3);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 10, 30, 0.4);
            width: 100%;
            max-width: 420px;
        }
        
        .auth-card h2 {
            text-align: center;
            background: linear-gradient(135deg, #a0d8ff 0%, #5dade2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .auth-card input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid rgba(100, 200, 255, 0.3);
            background: rgba(10, 25, 47, 0.5);
            color: #e6f7ff;
            border-radius: 10px;
            font-size: 16px;
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e5799 0%, #20a0d8 100%);
            border: none;
            color: #e6f7ff;
            font-size: 18px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .forum-hidden {
            display: none !important;
        }
        
        .forum-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            margin-top: 30px;
        }
        
        .sidebar {
            background: rgba(15, 35, 60, 0.3);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            height: fit-content;
            position: sticky;
            top: 30px;
        }
        
        .user-info {
            background: rgba(20, 50, 80, 0.3);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .ticket-item {
            background: rgba(20, 50, 80, 0.3);
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .ticket-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
        }
        
        .modal-content {
            background: rgba(15, 35, 60, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 15px;
            max-width: 850px;
            width: 90%;
            max-height: 85vh;
            margin: 50px auto;
            padding: 30px;
            color: #e6f7ff;
            position: relative;
            overflow-y: auto;
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 30px;
            cursor: pointer;
            color: #a0d8ff;
        }
        
        .message {
            background: rgba(20, 50, 80, 0.4);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #5dade2;
        }
        
        .message.admin {
            border-left: 4px solid #1e5799;
        }
        
        .reply-form textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            background: rgba(10, 25, 47, 0.5);
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 5px;
            color: #e6f7ff;
            font-family: inherit;
            font-size: 16px;
            resize: vertical;
        }
        
        .reply-form button {
            margin-top: 10px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #1e5799, #20a0d8);
            border: none;
            color: #e6f7ff;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .admin-panel {
            display: none;
            background: rgba(15, 35, 60, 0.3);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="snowflakes" id="snowflakes"></div>
    
    <div class="header">
        <h1>❄️ AltShield ❄️</h1>
        <p>Зимний Технический Форум</p>
    </div>
    
    <div class="container">
        <!-- СТРАНИЦА ВХОДА -->
        <div class="login-page" id="loginPage">
            <div class="auth-card">
                <h2>🔐 Вход в систему</h2>
                <input id="email" placeholder="Email" type="email" required>
                <input id="password" placeholder="Пароль" type="password" required>
                <button class="btn-primary" type="button" onclick="login()">Войти →</button>
                <p style="margin-top: 15px; text-align: center; color: #5dade2;">
                    Нет аккаунта? <a href="#" onclick="showRegister(); return false;" style="color: #a0d8ff;">Зарегистрироваться</a>
                </p>
            </div>
        </div>
        
        <!-- СТРАНИЦА РЕГИСТРАЦИИ -->
        <div class="login-page forum-hidden" id="registerPage">
            <div class="auth-card">
                <h2>📝 Регистрация</h2>
                <input id="regEmail" placeholder="Email" type="email" required>
                <input id="regPassword" placeholder="Пароль (мин. 6 символов)" type="password" required>
                <button class="btn-primary" type="button" onclick="register()">Создать аккаунт</button>
                <button class="btn-primary" style="background: #555; margin-top: 10px;" onclick="showLogin()">← Назад</button>
            </div>
        </div>
        
        <!-- ФОРУМ -->
        <div class="forum-hidden" id="forumPage">
            <div class="forum-grid">
                <div class="sidebar">
                    <div class="user-info">
                        <p><strong>👤</strong> <span id="currentUser">-</span></p>
                        <p><strong>Роль:</strong> <span id="userRole">-</span></p>
                    </div>
                    <button class="btn-primary" onclick="createTicket()">➕ Создать тикет</button>
                    <button class="btn-primary" style="background: #e74c3c; margin-top: 10px;" onclick="logout()">🚪 Выйти</button>
                </div>
                
                <div>
                    <div class="admin-panel" id="adminPanel">
                        <h3>🛡️ Панель администратора</h3>
                        <div id="userManagement"></div>
                    </div>
                    
                    <div class="tickets-section">
                        <h2>📨 Ваши тикеты</h2>
                        <div id="ticketsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно -->
    <div class="modal" id="ticketModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2 id="modalTicketTitle"></h2>
            <div id="ticketMessages"></div>
            <div class="reply-form">
                <textarea id="replyText" placeholder="Введите ваш ответ..."></textarea>
                <button class="btn-primary" onclick="sendReply()">Отправить</button>
                <button class="btn-primary" id="resolveBtn" onclick="resolveTicket()" style="background: #27ae60; margin-left: 10px;">Закрыть тикет</button>
            </div>
        </div>
    </div>

    <!-- 🔥 ВАШ FIREBASE КОНФИГ -->
    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyDFrNtflFEnxG6JmxUIutdVloprgJcyMFs",
            authDomain: "altshield-forum.firebaseapp.com",
            projectId: "altshield-forum",
            storageBucket: "altshield-forum.firebasestorage.app",
            messagingSenderId: "140096930192",
            appId: "1:140096930192:web:d8ff3b01a1c1a1e374f315"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            getDocs, 
            doc, 
            updateDoc, 
            query, 
            orderBy, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUser = null;
        let currentTicket = null;
        let ticketsUnsubscribe = null;

        // Управление страницами
        function showLogin() {
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('registerPage').classList.add('forum-hidden');
            document.getElementById('forumPage').classList.add('forum-hidden');
        }

        function showRegister() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('registerPage').classList.remove('forum-hidden');
            document.getElementById('forumPage').classList.add('forum-hidden');
        }

        function showForum() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('registerPage').classList.add('forum-hidden');
            document.getElementById('forumPage').classList.remove('forum-hidden');
            
            document.getElementById('currentUser').textContent = currentUser.email;
            
            const isOwner = currentUser.email === "kjuvboltm098@gmail.com";
            document.getElementById('userRole').textContent = isOwner ? '👑 Владелец' : '👤 Пользователь';
            
            if (isOwner) {
                document.getElementById('adminPanel').style.display = 'block';
            }
            
            loadTickets();
        }

        // Аутентификация
        async function register() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            
            if (password.length < 6) {
                alert('❌ Пароль должен быть минимум 6 символов!');
                return;
            }
            
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert('✅ Регистрация успешна! Теперь войдите.');
                showLogin();
            } catch (error) {
                alert('❌ Ошибка: ' + error.message);
                console.error(error);
            }
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('❌ Введите email и пароль!');
                return;
            }
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert('❌ Ошибка входа: ' + error.message);
                console.error(error);
            }
        }

        async function logout() {
            try {
                await signOut(auth);
                showLogin();
            } catch (error) {
                alert('❌ Ошибка: ' + error.message);
            }
        }

        // Тикеты
        async function createTicket() {
            const title = prompt('📝 Тема тикета (мин. 5 символов):');
            if (!title || title.trim().length < 5) {
                alert('❌ Минимум 5 символов!');
                return;
            }
            
            const text = prompt('💬 Описание проблемы:');
            if (!text || text.trim().length < 10) {
                alert('❌ Минимум 10 символов!');
                return;
            }
            
            try {
                await addDoc(collection(db, 'tickets'), {
                    title: title.trim(),
                    author: currentUser.email,
                    status: 'open',
                    createdAt: new Date(),
                    messages: [{
                        author: currentUser.email,
                        text: text.trim(),
                        timestamp: new Date(),
                        isAdmin: false
                    }]
                });
                alert('✅ Тикет создан успешно!');
            } catch (error) {
                alert('❌ Ошибка: ' + error.message);
                console.error(error);
            }
        }

        function loadTickets() {
            const list = document.getElementById('ticketsList');
            list.innerHTML = '<p style="color: #5dade2;">Загрузка...</p>';
            
            const q = query(collection(db, 'tickets'), orderBy('createdAt', 'desc'));
            
            if (ticketsUnsubscribe) {
                ticketsUnsubscribe(); // Остановить старую подписку
            }
            
            ticketsUnsubscribe = onSnapshot(q, (snapshot) => {
                list.innerHTML = '';
                
                const isOwner = currentUser.email === "kjuvboltm098@gmail.com";
                
                if (isOwner) {
                    // Владелец видит все тикеты
                    document.getElementById('adminPanel').style.display = 'block';
                    document.querySelector('.tickets-section h2').textContent = '📨 Все тикеты';
                } else {
                    // Обычный пользователь видит только свои
                    document.getElementById('adminPanel').style.display = 'none';
                    document.querySelector('.tickets-section h2').textContent = '📨 Ваши тикеты';
                }
                
                snapshot.forEach(doc => {
                    const ticket = { id: doc.id, ...doc.data() };
                    
                    // Фильтрация для обычных пользователей
                    if (!isOwner && ticket.author !== currentUser.email) return;
                    
                    const div = document.createElement('div');
                    div.className = `ticket-item ${ticket.status === 'resolved' ? 'resolved' : ''}`;
                    div.onclick = () => openTicket(ticket);
                    
                    const statusText = {
                        'open': 'Открыт',
                        'answered': 'Отвечен',
                        'resolved': 'Решен'
                    };
                    
                    div.innerHTML = `
                        <div class="ticket-header">
                            <span class="ticket-title">${ticket.title}</span>
                            <span class="ticket-status status-${ticket.status}">${statusText[ticket.status]}</span>
                        </div>
                        <div class="ticket-meta">
                            Автор: ${ticket.author} | Создан: ${ticket.createdAt.toDate().toLocaleString()}
                        </div>
                    `;
                    list.appendChild(div);
                });
                
                if (list.innerHTML === '') {
                    list.innerHTML = '<p style="color: #5dade2; text-align: center;">Тикетов нет</p>';
                }
            }, (error) => {
                console.error("Ошибка загрузки тикетов:", error);
                list.innerHTML = '<p style="color: #e74c3c;">❌ Ошибка загрузки данных</p>';
            });
        }

        function openTicket(ticket) {
            currentTicket = ticket;
            document.getElementById('modalTicketTitle').textContent = ticket.title;
            
            const container = document.getElementById('ticketMessages');
            container.innerHTML = '';
            
            ticket.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.isAdmin ? 'admin' : ''}`;
                div.innerHTML = `
                    <div class="message-owner">${msg.author} ${msg.isAdmin ? '(Админ)' : ''}</div>
                    <div class="message-text">${msg.text}</div>
                    <div class="message-time">${msg.timestamp.toDate().toLocaleString()}</div>
                `;
                container.appendChild(div);
            });
            
            const isOwner = currentUser.email === "kjuvboltm098@gmail.com";
            const canReply = isOwner || ticket.author === currentUser.email;
            
            document.getElementById('replyForm').style.display = canReply && ticket.status !== 'resolved' ? 'block' : 'none';
            document.getElementById('resolveBtn').style.display = isOwner && ticket.status !== 'resolved' ? 'block' : 'none';
            
            document.getElementById('ticketModal').style.display = 'block';
        }

        async function sendReply() {
            const text = document.getElementById('replyText').value.trim();
            if (!text) {
                alert('❌ Введите текст!');
                return;
            }
            
            const isOwner = currentUser.email === "kjuvboltm098@gmail.com";
            currentTicket.messages.push({
                author: currentUser.email,
                text: text,
                timestamp: new Date(),
                isAdmin: isOwner
            });
            
            currentTicket.status = isOwner ? 'answered' : 'open';
            
            try {
                await updateDoc(doc(db, 'tickets', currentTicket.id), {
                    messages: currentTicket.messages,
                    status: currentTicket.status
                });
                document.getElementById('replyText').value = '';
            } catch (error) {
                alert('❌ Ошибка: ' + error.message);
            }
        }

        async function resolveTicket() {
            if (!confirm('❓ Закрыть тикет навсегда?')) return;
            
            try {
                await updateDoc(doc(db, 'tickets', currentTicket.id), { status: 'resolved' });
                alert('✅ Тикет закрыт!');
                closeModal();
            } catch (error) {
                alert('❌ Ошибка: ' + error.message);
            }
        }

        function closeModal() {
            document.getElementById('ticketModal').style.display = 'none';
            document.getElementById('replyText').value = '';
            currentTicket = null;
        }

        // Проверка входа
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                showForum();
            } else {
                showLogin();
            }
        });

        // Закрытие модального окна по клику вне
        window.onclick = (e) => {
            if (e.target === document.getElementById('ticketModal')) {
                closeModal();
            }
        };
    </script>
</body>
</html>
