<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltShield - Новогодний Форум</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at top, #0c1e2e 0%, #07121e 70%);
            color: #f0f9ff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Новогодний снег с разными символами */
        .snowflakes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        
        .snowflake {
            position: absolute;
            top: -10px;
            animation: snowfall linear infinite;
            filter: blur(0.3px);
        }
        
        @keyframes snowfall {
            0% {
                transform: translateY(-100px) rotate(0deg) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) rotate(540deg) translateX(100px);
                opacity: 0;
            }
        }
        
        .header {
            position: relative;
            z-index: 1;
            background: rgba(10, 25, 47, 0.2);
            backdrop-filter: blur(15px) saturate(180%);
            border-bottom: 1px solid rgba(100, 200, 255, 0.1);
            padding: 40px 0;
            text-align: center;
        }
        
        .header h1 {
            font-size: 4em;
            font-weight: 900;
            background: linear-gradient(135deg, #e6f7ff 0%, #a0d8ff 30%, #fff 50%, #f39c12 70%, #e74c3c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 12px 40px rgba(31, 110, 140, 0.5);
            letter-spacing: -2px;
            margin-bottom: 10px;
            animation: gradientShift 8s ease infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg); }
        }
        
        .header p {
            color: #a0d8ff;
            font-size: 1.4em;
            font-weight: 600;
            opacity: 0.8;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        
        /* Новогодние карточки */
        .auth-card {
            background: rgba(15, 35, 60, 0.25);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 
                0 8px 32px rgba(0, 10, 30, 0.4), 
                inset 0 0 16px rgba(100, 200, 255, 0.1),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 420px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .auth-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 
                0 12px 48px rgba(0, 15, 40, 0.6), 
                inset 0 0 20px rgba(100, 200, 255, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        
        .auth-card h2 {
            text-align: center;
            background: linear-gradient(135deg, #a0d8ff 0%, #5dade2 50%, #f39c12 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 800;
        }
        
        .auth-card input {
            width: 100%;
            padding: 16px;
            margin: 14px 0;
            border: 1px solid rgba(100, 200, 255, 0.3);
            background: rgba(10, 25, 47, 0.3);
            color: #e6f7ff;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .auth-card input:focus {
            outline: none;
            border-color: #5dade2;
            box-shadow: 
                inset 0 2px 4px rgba(0, 0, 0, 0.2),
                0 0 0 3px rgba(93, 173, 226, 0.2);
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1e5799 0%, #20a0d8 40%, #f39c12 70%, #e74c3c 100%);
            border: none;
            color: #e6f7ff;
            font-size: 18px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 15px;
            position: relative;
            overflow: hidden;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s;
        }
        
        .btn-primary:hover::before {
            left: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 35px rgba(31, 110, 140, 0.6);
        }
        
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        
        .forum-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            margin-top: 30px;
        }
        
        .sidebar {
            background: rgba(15, 35, 60, 0.25);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 20px;
            padding: 25px;
            height: fit-content;
            position: sticky;
            top: 30px;
            box-shadow: 0 6px 25px rgba(0, 10, 30, 0.4);
        }
        
        .user-info {
            background: rgba(20, 50, 80, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(100, 200, 255, 0.1);
        }
        
        .ticket-item {
            background: rgba(20, 50, 80, 0.3);
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(5px);
        }
        
        .ticket-item:hover {
            transform: translateY(-6px) translateX(5px);
            box-shadow: 0 12px 35px rgba(31, 110, 140, 0.4);
            border-color: rgba(100, 200, 255, 0.4);
            background: rgba(25, 65, 100, 0.4);
        }
        
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            z-index: 1000;
        }
        
        .modal-content {
            background: rgba(15, 35, 60, 0.9);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 24px;
            max-width: 850px;
            width: 90%;
            max-height: 85vh;
            margin: 50px auto;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0, 10, 30, 0.6);
        }
    </style>
</head>
<body>
    <!-- Анимация снега -->
    <div class="snowflakes" id="snowflakes"></div>
    
    <div class="header">
        <h1>❄️ AltShield ❄️</h1>
        <p>Новогодний Технический Форум 2024</p>
    </div>
    
    <div class="container">
        <!-- СТРАНИЦА ВХОДА -->
        <div class="login-page" id="loginPage">
            <div class="auth-card">
                <form id="loginForm">
                    <h2>🔐 Вход в систему</h2>
                    <input id="email" placeholder="Email" type="email" required>
                    <input id="password" placeholder="Пароль" type="password" required>
                    <button class="btn-primary" type="button" onclick="login()">Войти →</button>
                    <p style="margin-top: 15px; text-align: center;">
                        <a href="#" onclick="showRegister(); return false" style="color: #a0d8ff;">Зарегистрироваться</a>
                    </p>
                </form>
            </div>
        </div>
        
        <!-- СТРАНИЦА РЕГИСТРАЦИИ -->
        <div class="login-page forum-hidden" id="registerPage">
            <div class="auth-card">
                <form id="registerForm">
                    <h2>📝 Регистрация</h2>
                    <input id="regEmail" placeholder="Email" type="email" required>
                    <input id="regPassword" placeholder="Пароль" type="password" required>
                    <button class="btn-primary" type="button" onclick="register()">Создать аккаунт</button>
                    <button class="btn-primary" style="background: #555; margin-top: 10px;" onclick="showLogin()">← Назад</button>
                </form>
            </div>
        </div>
        
        <!-- ФОРУМ -->
        <div class="forum-hidden" id="forumPage">
            <div class="forum-grid">
                <div class="sidebar">
                    <div class="user-info">
                        <p><strong>👤</strong> <span id="currentUser">-</span></p>
                        <p><strong>Роль:</strong> <span id="userRole">-</span></p>
                    </div>
                    <button class="sidebar-btn" onclick="createTicket()">➕ Создать тикет</button>
                    <button class="sidebar-btn" onclick="logout()">🚪 Выйти</button>
                </div>
                
                <div>
                    <div class="admin-panel" id="adminPanel">
                        <h3>🛡️ Панель администратора</h3>
                        <div id="ticketsList"></div>
                    </div>
                    
                    <div class="tickets-section">
                        <h2>📨 Ваши тикеты</h2>
                        <div id="ticketsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно -->
    <div class="modal" id="ticketModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2 id="modalTicketTitle"></h2>
            <div id="ticketMessages"></div>
            <div class="reply-form">
                <textarea id="replyText" placeholder="Введите ваш ответ..."></textarea>
                <button class="btn-primary" onclick="sendReply()">Отправить</button>
                <button class="btn-primary" id="resolveBtn" onclick="resolveTicket()" style="background: #27ae60;">Закрыть тикет</button>
            </div>
        </div>
    </div>

    <!-- 🔥 ВСТАВЬТЕ СВОЙ КОНФИГ СЮДА (Замените пустой объект) -->
    <script type="module">
        const firebaseConfig = {
            // ===== ЗАМЕНИТЕ ЭТОТ ОБЪЕКТ НА СВОЙ КОНФИГ ОТ FIREBASE =====.       .
 const firebaseConfig = {
     apiKey: "AIzaSyDFrNtflFEnxG6JmxUIutdVloprgJcyMFs",
     authDomain: "altshield-forum.firebaseapp.com",
     projectId: "altshield-forum",
     storageBucket: "altshield-forum.firebasestorage.app",
     messagingSenderId: "140096930192",
     appId: "1:140096930192:web:d8ff3b01a1c1a1e374f315"
};

        // Дальше идет весь остальной код
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUser = null;
        let currentTicket = null;
        let ticketsUnsubscribe = null;

        // Управление страницами
        function showLogin() {
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('registerPage').classList.add('forum-hidden');
            document.getElementById('forumPage').classList.add('forum-hidden');
        }

        function showRegister() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('registerPage').classList.remove('forum-hidden');
            document.getElementById('forumPage').classList.add('forum-hidden');
        }

        async function showForum() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('registerPage').classList.add('forum-hidden');
            document.getElementById('forumPage').classList.remove('forum-hidden');
            
            document.getElementById('currentUser').textContent = currentUser.email;
            
            const isOwner = currentUser.email === "kjuvboltm098@gmail.com";
            document.getElementById('userRole').textContent = isOwner ? '👑 Владелец' : '👤 Пользователь';
            
            if (isOwner) {
                document.getElementById('adminPanel').style.display = 'block';
            }
            
            loadTickets();
        }

        // Аутентификация
        async function register() {
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            
            if (password.length < 6) {
                alert('❌ Пароль минимум 6 символов!');
                return;
            }
            
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert('✅ Регистрация успешна!');
                showLogin();
            } catch (e) {
                alert('❌ ' + e.message);
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (e) {
                alert('❌ ' + e.message);
            }
        }

        async function logout() {
            await signOut(auth);
            showLogin();
        }

        // Тикеты
        async function createTicket() {
            const title = prompt('📝 Тема тикета (мин. 5 символов):');
            if (!title || title.length < 5) return;
            
            const text = prompt('💬 Описание проблемы:');
            if (!text || text.length < 10) return;
            
            try {
                await addDoc(collection(db, 'tickets'), {
                    title: title,
                    author: currentUser.email,
                    status: 'open',
                    createdAt: new Date(),
                    messages: [{
                        author: currentUser.email,
                        text: text,
                        timestamp: new Date(),
                        isAdmin: false
                    }]
                });
                alert('✅ Тикет создан!');
            } catch (e) {
                alert('❌ ' + e.message);
            }
        }

        function loadTickets() {
            const list = document.getElementById('ticketsList');
            list.innerHTML = '<p style="color: #5dade2;">Загрузка...</p>';
            
            const q = query(collection(db, 'tickets'), orderBy('createdAt', 'desc'));
            
            ticketsUnsubscribe = onSnapshot(q, (snapshot) => {
                list.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const ticket = { id: doc.id, ...doc.data() };
                    const isOwner = currentUser.email === "kjuvboltm098@gmail.com";
                    
                    if (!isOwner && ticket.author !== currentUser.email) return;
                    
                    const div = document.createElement('div');
                    div.className = `ticket-item ${ticket.status === 'resolved' ? 'resolved' : ''}`;
                    div.onclick = () => openTicket(ticket);
                    
                    div.innerHTML = `
                        <div class="ticket-header">
                            <span class="ticket-title">${ticket.title}</span>
                            <span class="ticket-status status-${ticket.status}">${ticket.status}</span>
                        </div>
                        <div class="ticket-meta">
                            Автор: ${ticket.author} | ${ticket.createdAt.toDate().toLocaleString()}
                        </div>
                    `;
                    list.appendChild(div);
                });
                
                if (list.innerHTML === '') {
                    list.innerHTML = '<p style="color: #5dade2; text-align: center;">Нет тикетов</p>';
                }
            });
        }

        function openTicket(ticket) {
            currentTicket = ticket;
            document.getElementById('modalTicketTitle').textContent = ticket.title;
            
            const container = document.getElementById('ticketMessages');
            container.innerHTML = '';
            
            ticket.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.isAdmin ? 'admin' : ''}`;
                div.innerHTML = `
                    <div class="message-owner">${msg.author} ${msg.isAdmin ? '(Админ)' : ''}</div>
                    <div class="message-text">${msg.text}</div>
                    <div class="message-time">${msg.timestamp.toDate().toLocaleString()}</div>
                `;
                container.appendChild(div);
            });
            
            const isOwner = currentUser.email === "kjuvboltm098@gmail.com";
            const canReply = isOwner || ticket.author === currentUser.email;
            
            document.getElementById('replyForm').style.display = canReply && ticket.status !== 'resolved' ? 'block' : 'none';
            document.getElementById('resolveBtn').style.display = isOwner && ticket.status !== 'resolved' ? 'block' : 'none';
            
            document.getElementById('ticketModal').style.display = 'block';
        }

        async function sendReply() {
            const text = document.getElementById('replyText').value.trim();
            if (!text) return;
            
            const isOwner = currentUser.email === "kjuvboltm098@gmail.com";
            currentTicket.messages.push({
                author: currentUser.email,
                text: text,
                timestamp: new Date(),
                isAdmin: isOwner
            });
            
            currentTicket.status = isOwner ? 'answered' : 'open';
            
            try {
                await updateDoc(doc(db, 'tickets', currentTicket.id), {
                    messages: currentTicket.messages,
                    status: currentTicket.status
                });
                document.getElementById('replyText').value = '';
            } catch (e) {
                alert('❌ ' + e.message);
            }
        }

        async function resolveTicket() {
            if (!confirm('❓ Закрыть тикет?')) return;
            
            try {
                await updateDoc(doc(db, 'tickets', currentTicket.id), { status: 'resolved' });
                alert('✅ Тикет закрыт!');
                closeModal();
            } catch (e) {
                alert('❌ ' + e.message);
            }
        }

        function closeModal() {
            document.getElementById('ticketModal').style.display = 'none';
            document.getElementById('replyText').value = '';
            currentTicket = null;
        }

        // Проверка входа
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                showForum();
            } else {
                showLogin();
            }
        });

        // Закрытие модального окна
        window.onclick = (e) => {
            if (e.target === document.getElementById('ticketModal')) {
                closeModal();
            }
        };
    </script>
</body>
</html>
