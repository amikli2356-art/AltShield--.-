<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Альтшилд - Зимний Портал 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 50%, #90caf9 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Анимация снега */
        .snowflake {
            position: fixed;
            top: -10px;
            color: rgba(255, 255, 255, 0.8);
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            font-size: 1em;
        }

        @keyframes fall {
            from { transform: translateY(-100vh) rotate(0deg); }
            to { transform: translateY(100vh) rotate(360deg); }
        }

        /* Шапка */
        header {
            background: rgba(25, 118, 210, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 2.5em;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            background: linear-gradient(to right, #e3f2fd, #bbdefb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .auth-section {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: linear-gradient(to right, #42a5f5, #1e88e5);
            color: white;
        }

        .btn-success {
            background: linear-gradient(to right, #66bb6a, #43a047);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(to right, #ef5350, #e53935);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .owner-badge {
            background: linear-gradient(to right, #ffd54f, #ffb300);
            color: #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Навигация */
        nav {
            background: rgba(66, 165, 245, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 99;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .nav-tabs {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 5px;
            padding: 0 20px;
        }

        .tab {
            padding: 15px 30px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            border-radius: 8px 8px 0 0;
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Основной контент */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            min-height: calc(100vh - 200px);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Карточки игроков */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .player-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.25);
            background: rgba(255, 255, 255, 0.95);
        }

        .player-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .player-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #1976d2;
            margin-bottom: 10px;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e53935;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: none;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .player-card:hover .delete-btn {
            display: block;
        }

        /* Формы */
        .form-section {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .form-section h3 {
            color: #1976d2;
            margin-bottom: 20px;
            font-size: 1.5em;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #bbdefb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.7);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #42a5f5;
            box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #1976d2;
            font-size: 1.5em;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        /* Статьи вики */
        .wiki-articles {
            display: grid;
            gap: 20px;
        }

        .wiki-article {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .wiki-article:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.25);
        }

        .wiki-article h3 {
            color: #1976d2;
            margin-bottom: 10px;
            font-size: 1.4em;
        }

        .wiki-article .timestamp {
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
        }

        .wiki-article p {
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
        }

        .edit-controls {
            display: none;
            position: absolute;
            top: 15px;
            right: 15px;
            gap: 5px;
        }

        .wiki-article:hover .edit-controls {
            display: flex;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 5px;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .logo {
                font-size: 2em;
            }
            
            .nav-tabs {
                flex-wrap: wrap;
            }
            
            .tab {
                flex: 1;
                min-width: 120px;
                text-align: center;
            }
            
            .players-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Анимация снега -->
    <div id="snow-container"></div>

    <!-- Шапка -->
    <header>
        <div class="header-content">
            <div class="logo">❄️ Альтшилд</div>
            <div class="auth-section">
                <span id="ownerStatus" class="owner-badge hidden">👑 Владелец</span>
                <button id="authBtn" class="btn btn-primary" onclick="showCodeModal()">Код</button>
            </div>
        </div>
    </header>

    <!-- Навигация -->
    <nav>
        <div class="nav-tabs">
            <button class="tab active" onclick="switchTab('players')">Игроки</button>
            <button class="tab" onclick="switchTab('wiki')">Википедия</button>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container">
        <!-- Вкладка Игроки -->
        <div id="players-tab" class="tab-content active">
            <div id="addPlayerForm" class="form-section hidden">
                <h3>Добавить нового игрока</h3>
                <div class="form-group">
                    <label for="playerImage">URL изображения или загрузить файл:</label>
                    <input type="text" id="playerImage" placeholder="https://example.com/avatar.jpg">
                    <input type="file" id="playerImageFile" accept="image/*" style="margin-top: 10px;">
                </div>
                <div class="form-group">
                    <label for="playerName">Никнейм игрока:</label>
                    <input type="text" id="playerName" placeholder="Введите никнейм">
                </div>
                <button class="btn btn-success" onclick="addPlayer()">Добавить игрока</button>
            </div>
            <div id="playersGrid" class="players-grid"></div>
        </div>

        <!-- Вкладка Википедия -->
        <div id="wiki-tab" class="tab-content">
            <div id="addWikiForm" class="form-section hidden">
                <h3>Добавить новую статью</h3>
                <div class="form-group">
                    <label for="wikiTitle">Заголовок статьи:</label>
                    <input type="text" id="wikiTitle" placeholder="Введите заголовок">
                </div>
                <div class="form-group">
                    <label for="wikiContent">Содержание:</label>
                    <textarea id="wikiContent" placeholder="Введите текст статьи..."></textarea>
                </div>
                <button class="btn btn-success" onclick="addWikiArticle()">Добавить статью</button>
            </div>
            <div id="wikiArticles" class="wiki-articles"></div>
        </div>
    </div>

    <!-- Модальное окно для ввода кода -->
    <div id="codeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Введите код доступа</h3>
                <button class="close-btn" onclick="closeCodeModal()">&times;</button>
            </div>
            <div class="form-group">
                <input type="password" id="accessCode" placeholder="Введите код...">
            </div>
            <button class="btn btn-primary" onclick="checkCode()">Подтвердить</button>
            <p id="codeError" style="color: red; margin-top: 10px; display: none;">Неверный код!</p>
        </div>
    </div>

    <script>
        // Константы
        const OWNER_CODE = 'pasgsadahfe-23461';
        const STORAGE_PREFIX = 'altshield_';
        
        // Состояние
        let isOwner = localStorage.getItem(STORAGE_PREFIX + 'isOwner') === 'true';
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            createSnowEffect();
            updateUI();
            loadPlayers();
            loadWikiArticles();
            
            // Обработка загрузки файла
            document.getElementById('playerImageFile').addEventListener('change', handleImageUpload);
        });

        // Создание эффекта снега
        function createSnowEffect() {
            const snowflakes = ['❄', '❅', '❆'];
            const container = document.getElementById('snow-container');
            
            for (let i = 0; i < 50; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.textContent = snowflakes[Math.floor(Math.random() * snowflakes.length)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 5 + 5) + 's';
                snowflake.style.animationDelay = Math.random() * 5 + 's';
                snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';
                container.appendChild(snowflake);
            }
        }

        // Обновление UI в зависимости от прав
        function updateUI() {
            const ownerStatus = document.getElementById('ownerStatus');
            const authBtn = document.getElementById('authBtn');
            const addPlayerForm = document.getElementById('addPlayerForm');
            const addWikiForm = document.getElementById('addWikiForm');
            
            if (isOwner) {
                ownerStatus.classList.remove('hidden');
                authBtn.textContent = 'Выйти';
                authBtn.onclick = logout;
                addPlayerForm.classList.remove('hidden');
                addWikiForm.classList.remove('hidden');
            } else {
                ownerStatus.classList.add('hidden');
                authBtn.textContent = 'Код';
                authBtn.onclick = showCodeModal;
                addPlayerForm.classList.add('hidden');
                addWikiForm.classList.add('hidden');
            }
        }

        // Переключение вкладок
        function switchTab(tabName) {
            // Убираем активный класс у всех вкладок и контента
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // Добавляем активный класс выбранной вкладке
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        // Модальное окно кода
        function showCodeModal() {
            document.getElementById('codeModal').style.display = 'block';
            document.getElementById('accessCode').value = '';
            document.getElementById('codeError').style.display = 'none';
        }

        function closeCodeModal() {
            document.getElementById('codeModal').style.display = 'none';
        }

        function checkCode() {
            const code = document.getElementById('accessCode').value;
            if (code === OWNER_CODE) {
                isOwner = true;
                localStorage.setItem(STORAGE_PREFIX + 'isOwner', 'true');
                updateUI();
                closeCodeModal();
                alert('✅ Доступ получен! Теперь вы можете добавлять и редактировать контент.');
            } else {
                document.getElementById('codeError').style.display = 'block';
            }
        }

        function logout() {
            if (confirm('❓ Вы уверены, что хотите выйти из режима владельца?')) {
                isOwner = false;
                localStorage.setItem(STORAGE_PREFIX + 'isOwner', 'false');
                updateUI();
            }
        }

        // Работа с игроками
        function loadPlayers() {
            const players = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'players') || '[]');
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = '';
            
            players.forEach((player, index) => {
                const card = createPlayerCard(player, index);
                grid.appendChild(card);
            });
        }

        function createPlayerCard(player, index) {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.innerHTML = `
                <button class="delete-btn" onclick="deletePlayer(${index})" title="Удалить">×</button>
                <img src="${player.image}" alt="${player.name}" class="player-avatar" onerror="this.src='https://via.placeholder.com/120?text=🎮'">
                <div class="player-name">${player.name}</div>
            `;
            return card;
        }

        function addPlayer() {
            const imageInput = document.getElementById('playerImage');
            const nameInput = document.getElementById('playerName');
            const imageFile = document.getElementById('playerImageFile').files[0];
            
            let imageUrl = imageInput.value.trim();
            const name = nameInput.value.trim();
            
            if (!name) {
                alert('❌ Введите никнейм игрока!');
                return;
            }
            
            if (imageFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    savePlayer(e.target.result, name);
                };
                reader.readAsDataURL(imageFile);
            } else if (imageUrl) {
                savePlayer(imageUrl, name);
            } else {
                savePlayer('https://via.placeholder.com/120?text=🎮', name);
            }
        }

        function savePlayer(imageUrl, name) {
            const players = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'players') || '[]');
            players.push({ image: imageUrl, name: name });
            localStorage.setItem(STORAGE_PREFIX + 'players', JSON.stringify(players));
            
            document.getElementById('playerImage').value = '';
            document.getElementById('playerName').value = '';
            document.getElementById('playerImageFile').value = '';
            
            loadPlayers();
        }

        function deletePlayer(index) {
            if (!isOwner) return;
            
            if (confirm('❓ Удалить этого игрока?')) {
                const players = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'players') || '[]');
                players.splice(index, 1);
                localStorage.setItem(STORAGE_PREFIX + 'players', JSON.stringify(players));
                loadPlayers();
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('playerImage').value = '';
            }
        }

        // Работа с вики
        function loadWikiArticles() {
            const articles = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'wiki') || '[]');
            const container = document.getElementById('wikiArticles');
            container.innerHTML = '';
            
            articles.forEach((article, index) => {
                const articleElement = createWikiArticle(article, index);
                container.appendChild(articleElement);
            });
        }

        function createWikiArticle(article, index) {
            const articleDiv = document.createElement('div');
            articleDiv.className = 'wiki-article';
            articleDiv.innerHTML = `
                <div class="edit-controls">
                    <button class="btn btn-primary btn-small" onclick="editWikiArticle(${index})">✏️ Редактировать</button>
                    <button class="btn btn-danger btn-small" onclick="deleteWikiArticle(${index})">🗑️ Удалить</button>
                </div>
                <h3>${article.title}</h3>
                <div class="timestamp">📅 ${new Date(article.timestamp).toLocaleString('ru-RU')}</div>
                <p>${article.content}</p>
            `;
            return articleDiv;
        }

        function addWikiArticle() {
            const titleInput = document.getElementById('wikiTitle');
            const contentInput = document.getElementById('wikiContent');
            
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();
            
            if (!title || !content) {
                alert('❌ Заполните заголовок и содержание статьи!');
                return;
            }
            
            const articles = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'wiki') || '[]');
            articles.unshift({
                title: title,
                content: content,
                timestamp: new Date().toISOString()
            });
            localStorage.setItem(STORAGE_PREFIX + 'wiki', JSON.stringify(articles));
            
            titleInput.value = '';
            contentInput.value = '';
            
            loadWikiArticles();
        }

        function deleteWikiArticle(index) {
            if (!isOwner) return;
            
            if (confirm('❓ Удалить эту статью?')) {
                const articles = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'wiki') || '[]');
                articles.splice(index, 1);
                localStorage.setItem(STORAGE_PREFIX + 'wiki', JSON.stringify(articles));
                loadWikiArticles();
            }
        }

        function editWikiArticle(index) {
            const articles = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'wiki') || '[]');
            const article = articles[index];
            
            const newTitle = prompt('📋 Новый заголовок:', article.title);
            if (newTitle === null) return;
            
            const newContent = prompt('📋 Новое содержание:', article.content);
            if (newContent === null) return;
            
            if (newTitle.trim() && newContent.trim()) {
                article.title = newTitle.trim();
                article.content = newContent.trim();
                article.timestamp = new Date().toISOString();
                localStorage.setItem(STORAGE_PREFIX + 'wiki', JSON.stringify(articles));
                loadWikiArticles();
            }
        }

        // Закрытие модального окна по клику вне его
        window.onclick = function(event) {
            const modal = document.getElementById('codeModal');
            if (event.target === modal) {
                closeCodeModal();
            }
        }

        // Поддержка Enter в поле кода
        document.getElementById('accessCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkCode();
            }
        });
    </script>
</body>
</html>
